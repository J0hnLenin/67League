services:
  postgres:
    image: postgres:16-alpine
    container_name: liga67-postgres
    environment:
      POSTGRES_USER: liga
      POSTGRES_PASSWORD: liga
      POSTGRES_DB: liga67
    ports:
      - "5432:5432"
    volumes:
      - liga67_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liga -d liga67"]
      interval: 2s
      timeout: 2s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    command: ["-path", "/migrations", "-database", "postgres://liga:liga@postgres:5432/liga67?sslmode=disable", "up"]
    volumes:
      - ./src/backend/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: liga67-backend
    environment:
      LIGA_DB_DSN: postgres://liga:liga@postgres:5432/liga67?sslmode=disable
      LIGA_JWT_SECRET: ${LIGA_JWT_SECRET:-change-me-in-production}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ./api

  admin:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: liga67-admin
    environment:
      LIGA_DB_DSN: postgres://liga:liga@postgres:5432/liga67?sslmode=disable
      LIGA_JWT_SECRET: ${LIGA_JWT_SECRET:-change-me-in-production}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ./admin

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: liga67-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8081/admin
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - admin

volumes:
  liga67_pgdata:
