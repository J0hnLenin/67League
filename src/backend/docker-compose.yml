services:
  postgres:
    image: postgres:16-alpine
    container_name: liga67-postgres
    environment:
      POSTGRES_USER: liga
      POSTGRES_PASSWORD: liga
      POSTGRES_DB: liga67
    ports:
      - "5432:5432"
    volumes:
      - liga67_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liga -d liga67"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  liga67_pgdata: