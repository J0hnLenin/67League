name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liga
          POSTGRES_PASSWORD: liga
          POSTGRES_DB: liga67
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('src/backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run migrations
        env:
          LIGA_DB_DSN: postgres://liga:liga@localhost:5432/liga67?sslmode=disable
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir migrations postgres "$LIGA_DB_DSN" up

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: staticcheck ./...

      - name: Unit tests
        env:
          LIGA_DB_DSN: postgres://liga:liga@localhost:5432/liga67?sslmode=disable
          LIGA_JWT_SECRET: test-secret-ci
        run: go test -race -coverprofile=coverage.out ./internal/application/... ./internal/domain/...

      - name: Integration tests
        env:
          LIGA_DB_DSN: postgres://liga:liga@localhost:5432/liga67?sslmode=disable
          LIGA_JWT_SECRET: test-secret-ci
        run: go test -race -coverprofile=coverage-integration.out ./internal/infrastructure/... ./internal/delivery/...

      - name: Build
        run: go build ./cmd/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
